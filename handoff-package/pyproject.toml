[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "file-pair-handoff"
version = "0.1.0"
description = "Opaque two-file handoff contract for collectors and Frozen Layer 0 importers"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["file_pair_handoff*"]
